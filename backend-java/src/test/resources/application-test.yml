spring:
  datasource:
    url: jdbc:h2:mem:tradeguard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
tradeguard:
  auth:
    jwt-secret: integration-test-secret-at-least-thirty-two-bytes
    cookie-secure: false
    allowed-origins:
      - http://localhost:3000
