spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/tradeguard?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${MYSQL_USERNAME:tradeguard}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration-mysql
