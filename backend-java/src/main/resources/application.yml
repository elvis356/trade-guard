spring:
  application:
    name: tradeguard-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tradeguard}
    username: ${DB_USERNAME:tradeguard}
    password: ${DB_PASSWORD:tradeguard_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    web:
      pageable:
        max-page-size: 100
  threads:
    virtual:
      enabled: true
  mvc:
    throw-exception-if-no-handler-found: true
server:
  error:
    include-message: never
market:
  price-limit-pct: 10
  lot-size: 1000
  enforce-trading-hours: true
  zone: Asia/Taipei
  open: "09:00"
  close: "13:30"
surveillance:
  window: 5m
  closing-price-deviation-pct: 5
  closing-minimum-quantity: 5000
  closing-window-minutes: 5
tradeguard:
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-lifetime: ${JWT_TTL:15m}
    cookie-name: ${JWT_COOKIE_NAME:tradeguard_session}
    cookie-secure: ${COOKIE_SECURE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    login-failure-threshold: 5
    login-lock-duration: 15m
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
