services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradeguard
      POSTGRES_USER: tradeguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tradeguard_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tradeguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeguard -d tradeguard"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tradeguard-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tradeguard
      DB_USERNAME: ${DB_USERNAME:-tradeguard}
      DB_PASSWORD: ${DB_PASSWORD:-tradeguard_local_only}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      EOD_TOKEN: ${EOD_TOKEN:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  tradeguard-postgres:
  tradeguard-redis:
