<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.ico" sizes="any">
  <title>TradeGuard UML 跨圖關聯工作台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --panel: #fff;
      --panel-2: #f5f5f5;
      --line: #e3e3e3;
      --ink: #0b0b0b;
      --muted: #666;
      --edge: #777;
      --green: #1f7a4d;
      --green-soft: #eaf5ee;
      --orange: #a66826;
      --orange-soft: #f7eee2;
      --blue: #536f7e;
      --blue-soft: #e8eef1;
      --violet: #75618f;
      --violet-soft: #efebf4;
      --red: #a84c46;
      --red-soft: #f6eae8;
      --shadow: 0 14px 34px rgb(0 0 0 / 8%);
      font-synthesis: none;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111;
      --panel: #191919;
      --panel-2: #222;
      --line: #363636;
      --ink: #f2f2f2;
      --muted: #aaa;
      --edge: #999;
      --green: #72c69a;
      --green-soft: #263d30;
      --orange: #e9ae68;
      --orange-soft: #403326;
      --blue: #85bedb;
      --blue-soft: #263b47;
      --violet: #b6a0df;
      --violet-soft: #362d46;
      --red: #e3928e;
      --red-soft: #432d2d;
      --shadow: 0 18px 40px rgb(0 0 0 / 22%);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.5 "Aptos", "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    button, input { color: inherit; font: inherit; }
    button {
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--panel);
      cursor: pointer;
      padding: 7px 10px;
      transition: border-color .16s, background .16s, transform .16s;
    }
    button:hover { border-color: var(--green); }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--green) 50%, transparent); outline-offset: 2px; }
    header {
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: #0b0b0b;
      color: #fff;
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 260px; flex: 1; }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid #fff;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: -.06em;
    }
    h1 { margin: 0; font: 600 16px/1.2 Georgia, "Noto Serif TC", serif; letter-spacing: -.025em; }
    .brand small { display: block; margin-top: 3px; color: #a3a3a3; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .toolbar { display: flex; align-items: center; gap: 7px; }
    .toolbar button { white-space: nowrap; }
    header button { border-color: #363636; background: #0b0b0b; color: #f2f2f2; border-radius: 2px; }
    header button:hover { border-color: #fff; background: #1c1c1c; }
    header button:disabled { color: #777; }
    .search {
      width: min(250px, 42vw);
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #111;
      color: #fff;
      padding: 8px 10px;
    }
    .search::placeholder { color: #a3a3a3; }
    .search-wrap { position: relative; }
    #results {
      position: absolute;
      z-index: 6;
      top: calc(100% + 5px);
      left: 0;
      width: min(390px, 86vw);
      max-height: 55vh;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--panel);
      padding: 6px;
      box-shadow: var(--shadow);
    }
    #results[hidden] { display: none; }
    #results button { display: block; width: 100%; margin: 2px 0; border-color: transparent; text-align: left; }
    #results button:hover { background: var(--panel-2); }
    #results p { margin: 6px; color: var(--muted); }
    #app { display: grid; grid-template-columns: 196px minmax(0, 1fr) 278px; min-height: 0; flex: 1; }
    nav, aside { min-width: 0; overflow: auto; background: var(--panel); }
    nav { padding: 14px 10px; border-right: 1px solid var(--line); }
    aside { padding: 16px; border-left: 1px solid var(--line); }
    .nav-label, .eyebrow {
      margin: 3px 8px 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    nav button {
      display: block;
      width: 100%;
      margin: 0 0 5px;
      border-color: transparent;
      background: transparent;
      padding: 8px 9px;
      text-align: left;
    }
    nav button:hover { background: var(--panel-2); }
    nav button.on { border-color: var(--ink); background: var(--ink); color: var(--panel); }
    nav button strong { display: block; font-size: 12px; }
    nav button small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .canvas-wrap { position: relative; display: flex; min-width: 0; min-height: 0; flex-direction: column; overflow: hidden; }
    #cv {
      display: block;
      width: 100%;
      height: auto;
      min-height: 0;
      flex: 1;
      touch-action: none;
      cursor: grab;
      background-image: radial-gradient(color-mix(in srgb, var(--line) 90%, transparent) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    #cv.grabbing { cursor: grabbing; }
    #trail {
      position: absolute;
      top: 12px;
      left: 14px;
      max-width: calc(100% - 28px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      padding: 5px 11px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #hint {
      flex: none;
      margin: 0 14px 7px;
      color: var(--muted);
      font-size: 11px;
    }
    #caption {
      flex: none;
      max-height: 68px;
      overflow: auto;
      border: 1px solid var(--line);
      border-left: 3px solid var(--green);
      border-radius: 2px;
      margin: 0 14px 8px;
      background: var(--panel);
      padding: 7px 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
    .node { cursor: grab; transition: opacity .16s; }
    #cv:focus, .node:focus { outline: none; }
    .node:focus-visible { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--green) 70%, transparent)); }
    .boundary { fill: color-mix(in srgb, var(--panel-2) 45%, transparent); stroke: var(--edge); stroke-width: 1.6; pointer-events: none; }
    .node.selected { filter: drop-shadow(0 0 7px color-mix(in srgb, var(--green) 55%, transparent)); }
    .node.dim, .edge.dim { opacity: .14; }
    .edge { transition: opacity .16s; }
    .edge.highlight line, .edge.highlight path.message-line { stroke: var(--green); stroke-width: 2.8; }
    .node-shape { fill: var(--panel); stroke-width: 2; }
    .svg-title { fill: var(--ink); font-size: 13px; font-weight: 750; pointer-events: none; }
    .svg-sub { fill: var(--muted); font-size: 10.5px; pointer-events: none; }
    .svg-field { fill: var(--ink); font: 10.5px ui-monospace, Consolas, monospace; pointer-events: none; }
    .edge-label-group { pointer-events: none; transition: opacity .16s; }
    .edge-label-group.dim { opacity: .14; }
    .edge-label-back { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .svg-edge-label { fill: var(--ink); font-size: 10px; font-weight: 650; pointer-events: none; }
    .lifeline { stroke: var(--edge); stroke-width: 1.2; stroke-dasharray: 6 6; opacity: .65; }
    .activation { fill: var(--green-soft); stroke: var(--green); stroke-width: 1.4; }
    .message-line { stroke: var(--edge); stroke-width: 1.7; marker-end: url(#arrow); }
    .message-line.return { stroke-dasharray: 6 4; }
    .diagram-caption { fill: var(--muted); font-size: 11px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .03em;
    }
    .status.plan { background: var(--orange-soft); color: var(--orange); }
    .status::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    aside h2 { margin: 9px 0 6px; font: 600 20px/1.25 Georgia, "Noto Serif TC", serif; }
    aside h3 { margin: 19px 0 7px; color: var(--muted); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    aside p { color: var(--muted); line-height: 1.65; }
    .kind {
      display: inline-block;
      border-radius: 5px;
      background: var(--blue);
      color: white;
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 750;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { padding: 5px 8px; color: var(--green); font-size: 10px; }
    .detail-list { margin: 0; padding-left: 17px; color: var(--muted); }
    .detail-list li { margin: 5px 0; overflow-wrap: anywhere; }
    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .legend span { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; }
    .swatch { width: 9px; height: 9px; border-radius: 3px; background: var(--swatch); }
    .note {
      margin-top: 17px;
      border-left: 3px solid var(--orange);
      background: var(--orange-soft);
      padding: 9px 10px;
      color: var(--ink);
      font-size: 10px;
      line-height: 1.6;
    }
    #matrix {
      position: fixed;
      z-index: 8;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgb(7 7 7 / 55%);
      padding: 18px;
    }
    #matrix.open { display: flex; }
    .matrix-card { display: flex; width: min(1120px, 100%); max-height: 88vh; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 2px; background: var(--panel); box-shadow: var(--shadow); }
    .matrix-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .matrix-head h2 { margin: 0; font: 600 18px Georgia, serif; }
    .matrix-scroll { overflow: auto; padding: 10px 14px 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { min-width: 70px; border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: center; }
    th { position: sticky; top: 0; background: var(--panel); color: var(--muted); }
    th:first-child, td:first-child { position: sticky; left: 0; min-width: 160px; background: var(--panel); text-align: left; }
    td button { min-width: 25px; padding: 2px 6px; border: 0; background: transparent; color: var(--green); font-weight: 800; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    tbody th { position: sticky; left: 0; top: auto; min-width: 160px; background: var(--panel); color: var(--ink); font-weight: 600; text-align: left; }
    aside h4 { margin: 11px 0 5px; color: var(--ink); font-size: 11px; }
    .trace-table td { vertical-align: top; text-align: left; }
    .trace-table .chips { gap: 3px; }
    .trace-table .chip { padding: 2px 6px; border: 1px solid var(--line); font-size: 10px; }
    footer { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 1px solid #222; background: #0b0b0b; color: #a3a3a3; font-size: 10px; }
    .toast { position: fixed; z-index: 10; right: 18px; bottom: 42px; display: none; border: 1px solid var(--line); border-radius: 2px; background: var(--panel); padding: 9px 12px; box-shadow: var(--shadow); color: var(--ink); }
    .toast.show { display: block; }
    @media (max-width: 980px) {
      #app { grid-template-columns: 164px minmax(0, 1fr); grid-template-rows: minmax(480px, 1fr) auto; }
      aside { grid-column: 1 / -1; max-height: 240px; border-top: 1px solid var(--line); border-left: 0; }
      nav { grid-row: 1; }
      .canvas-wrap { grid-row: 1; }
    }
    @media (max-width: 620px) {
      body { overflow: auto; min-height: 100%; }
      header { position: sticky; top: 0; }
      .brand { min-width: 100%; }
      .toolbar { width: 100%; flex-wrap: wrap; }
      .search { flex: 1; }
      #app { display: flex; flex-direction: column; }
      nav { display: flex; gap: 5px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
      .nav-label { display: none; }
      nav button { width: auto; min-width: max-content; margin: 0; }
      .canvas-wrap { min-height: 520px; }
      #caption { max-height: 90px; margin: 0 10px 8px; }
      aside { max-height: none; border-top: 1px solid var(--line); }
      footer { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark">TG</span>
      <div><h1>TradeGuard UML 工作台</h1><small>Cross-diagram system map · 目前實作基準</small></div>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <input id="search" class="search" type="search" role="combobox" aria-autocomplete="list" placeholder="跨圖搜尋元件、API、資料表…" aria-label="跨圖搜尋圖表元件" aria-controls="results" aria-expanded="false">
        <div id="results" role="listbox" aria-label="搜尋結果" hidden></div>
      </div>
      <button id="back" type="button" title="回到上一張圖">← 返回</button>
      <button id="matrixButton" type="button">跨圖關聯矩陣</button>
      <button id="traceButton" type="button">追溯矩陣</button>
      <button id="listButton" type="button">清單檢視</button>
      <button id="fit" type="button">重設視角</button>
      <button id="resetLayout" type="button" title="還原本圖被拖動的節點與連線">還原版面</button>
      <button id="theme" type="button" aria-label="切換色彩主題">◐</button>
    </div>
  </header>
  <div id="app">
    <nav id="nav" aria-label="UML 圖表"></nav>
    <main class="canvas-wrap">
      <div id="trail" aria-live="polite"></div>
      <svg id="cv" viewBox="0 0 1200 760" role="group" aria-label="互動式 UML 圖表；Tab 聚焦節點，Enter 選取，方向鍵移動">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--edge)"/></marker>
          <marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--edge)" stroke-width="1.5"/></marker>
          <marker id="diamond" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 6 6 1 11 6 6 11z" fill="var(--panel)" stroke="var(--edge)"/></marker>
        </defs>
        <g id="edges"></g><g id="nodes"></g><g id="edgeLabels"></g>
      </svg>
      <div id="caption" class="diagram-caption" aria-live="polite"></div>
      <div id="hint">點選節點查看跨圖追溯 · 拖曳平移 · 滾輪縮放 · 數字鍵 1–9、0 切換圖表</div>
    </main>
    <aside id="inspector"></aside>
  </div>
  <footer><span>依目前程式、資料庫 Migration 與 workflow 整理；圖示為概念／實作視圖，非自動反向工程輸出。</span><span>TradeGuard · docs/uml-workbench.html</span></footer>
  <div id="matrix" role="dialog" aria-modal="true" aria-labelledby="matrixTitle" aria-describedby="matrixContent">
    <section class="matrix-card">
      <div class="matrix-head"><h2 id="matrixTitle">元件 × 圖表關聯矩陣</h2><button id="closeMatrix" type="button" aria-label="關閉關聯矩陣">關閉 ✕</button></div>
      <div id="matrixContent" class="matrix-scroll"></div>
    </section>
  </div>
  <div id="sr" class="sr" aria-live="polite"></div>
  <div id="toast" class="toast" role="status"></div>

  <script id="uml-data">
/* TradeGuard UML 工作台資料：圖表、實體、欄位、追溯關係。
   新增或修改圖表時只改這個 <script id="uml-data"> 區塊，
   再執行：node docs/uml-workbench.check.js（腳本會直接讀本 HTML 的這個區塊）。 */
(function (root) {
  "use strict";
  const DATA = (function () {
    const TYPES = {
      actor: ["角色", "var(--orange)"], service: ["服務／元件", "var(--blue)"],
      usecase: ["使用案例", "var(--green)"], data: ["資料儲存", "var(--violet)"],
      domain: ["領域模型", "var(--violet)"], step: ["流程節點", "var(--green)"],
      external: ["外部系統", "var(--orange)"], state: ["狀態", "var(--blue)"]
    };
    const ENTITIES = {
      browser: {name:"瀏覽器／使用者介面",type:"service",desc:"Next.js App Router 前端；瀏覽器以同源 /api 路徑呼叫後端並使用 HttpOnly Cookie。",meta:["frontend-next/","Vercel 部署設定依環境而異"]},
      visitor: {name:"訪客",type:"actor",desc:"未登入使用者，可讀取公開市場資料並建立交易員帳號。",meta:["公開行情","公開註冊"]},
      trader: {name:"交易員",type:"actor",desc:"可建立及取消本人限價委託，查看本人委託。",meta:["TRADER"]},
      monitor: {name:"監控人員",type:"actor",desc:"可檢視警示／案件、提報案件並覆核其他監控人員提報的案件。",meta:["SURVEILLANCE","四眼原則"]},
      auditor: {name:"稽核員",type:"actor",desc:"可讀取監控資料、驗證稽核鏈、對帳及讀取日終 XML。",meta:["AUDITOR","唯讀監控資料"]},
      admin: {name:"管理員",type:"actor",desc:"可管理商品及角色帳號，並使用稽核及日終工作區。",meta:["ADMIN","Bootstrap 或管理員建立"]},
      vercel: {name:"Vercel / Next.js",type:"service",desc:"前端代管；同源 /api rewrites 將瀏覽器 API 呼叫轉送到設定的後端 URL。",meta:["frontend-next/","BACKEND_URL 為伺服器端環境變數"]},
      api: {name:"Spring Boot REST API",type:"service",desc:"Java 21 後端 API；執行驗證、角色授權及交易業務規則。",meta:["backend-java/","/api/*","Render Docker 服務"]},
      auth: {name:"身分驗證",type:"service",desc:"登入、註冊、登出、JWT Cookie、登入失敗鎖定及 token 撤銷。",meta:["AuthController","AuthService","SecurityConfiguration"]},
      userModule: {name:"使用者管理模組",type:"service",desc:"管理員建立及查詢應用程式帳號與角色。",meta:["user/UserService","AdminUserController","app_users"]},
      instrumentModule: {name:"商品管理模組",type:"service",desc:"管理員建立、更新、啟用／停用及刪除商品主檔。",meta:["instrument/InstrumentService","InstrumentController","instruments"]},
      health: {name:"服務狀態模組",type:"service",desc:"提供服務狀態端點供平台檢查服務存活。",meta:["health/HealthController","GET /api/health"]},
      market: {name:"商品與市場查詢",type:"service",desc:"商品主檔 CRUD、行情、委託簿及近期成交查詢。",meta:["InstrumentController","MarketController"]},
      matching: {name:"委託與撮合",type:"service",desc:"驗證限價委託、價格／時間優先撮合、部分成交及取消。",meta:["OrderController","OrderService","OrderValidator"]},
      surveillance: {name:"市場監控",type:"service",desc:"成交後檢查 WASH_TRADE 與 CLOSING_MARKUP 規則並保存警示；警示僅為人工調查線索。",meta:["SurveillanceService","TradeSurveillanceListener"]},
      audit: {name:"稽核與日終",type:"service",desc:"SHA-256 稽核鏈、帳本對帳、受保護 EOD 入口及每日 XML 報表。",meta:["AuditService","ReconciliationService","EodService"]},
      pg: {name:"PostgreSQL",type:"data",desc:"持久化事實來源；Flyway V1–V8 建立 schema。",meta:["orders / trades / order_events","users / instruments","alerts / cases / audit / EOD"]},

          const first=focusable[0],last=focusable[focusable.length-1];
          if(ev.shiftKey&&(document.activeElement===first||!$("#matrix").contains(document.activeElement))){ev.preventDefault();last.focus();}
          else if(!ev.shiftKey&&(document.activeElement===last||!$("#matrix").contains(document.activeElement))){ev.preventDefault();first.focus();}
        }
        return;
      }
      if(ev.target instanceof HTMLInputElement)return;
      if(ev.ctrlKey||ev.metaKey||ev.altKey||!/^[0-9]$/.test(ev.key))return;
      const index=ev.key==="0"?9:Number(ev.key)-1;
      if(DIAGRAMS[index])go(DIAGRAMS[index].id,selected);
    });
    const pointers=new Map();let pinchDistance=0;
    cv.addEventListener("pointerdown",ev=>{
      pointers.set(ev.pointerId,[ev.clientX,ev.clientY]);
      if(pointers.size===2){
        const [a,b]=[...pointers.values()];pinchDistance=Math.hypot(a[0]-b[0],a[1]-b[1]);drag=null;return;
      }
      const g=ev.target.closest(".node");
      drag={x:ev.clientX,y:ev.clientY,target:g,node:g&&!diagram().sequence?pointFor(diagram(),g.dataset.id):null,moved:false};
      cv.setPointerCapture(ev.pointerId);
      if(!g)cv.classList.add("grabbing");
    });
    cv.addEventListener("pointermove",ev=>{
      if(pointers.has(ev.pointerId))pointers.set(ev.pointerId,[ev.clientX,ev.clientY]);
      if(pointers.size===2){
        const [a,b]=[...pointers.values()],distance=Math.hypot(a[0]-b[0],a[1]-b[1]);
        if(pinchDistance&&distance)zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,pinchDistance/distance);
        pinchDistance=distance;return;
      }
      if(!drag)return;
      const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;
      if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<4)return;
      drag.moved=true;
      const scale=cv.getScreenCTM()?.a||cv.getBoundingClientRect().width/view.w;
      if(drag.node){
        drag.node.x+=dx/scale;drag.node.y+=dy/scale;
        diagram().edges?.forEach(e=>{if((e.a===drag.node.id||e.b===drag.node.id)&&e.via){e.viaSaved=e.viaSaved||e.via;e.via=null;}});
        drag.target.setAttribute("transform",`translate(${drag.node.x} ${drag.node.y})`);
        redrawEdges();applySelection();
      }else{
        view.x-=dx/scale;view.y-=dy/scale;cv.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
      }
      drag.x=ev.clientX;drag.y=ev.clientY;
    });
    cv.addEventListener("pointerup",ev=>{
      pointers.delete(ev.pointerId);if(pointers.size<2)pinchDistance=0;
      if(drag&&!drag.moved&&drag.target)pick(drag.target.dataset.id);
      if(drag?.moved&&drag.node){suppressClick=true;setTimeout(()=>{suppressClick=false;},0);}
      drag=null;cv.classList.remove("grabbing");
      try{cv.releasePointerCapture(ev.pointerId)}catch{}
    });
    cv.addEventListener("pointercancel",ev=>{pointers.delete(ev.pointerId);pinchDistance=0;drag=null;cv.classList.remove("grabbing")});
    function zoomAt(clientX,clientY,factor) {
      const width=view.w*factor;if(width<280||width>3400)return;
      const matrix=cv.getScreenCTM();
      if(!matrix)return;
      const point=new DOMPoint(clientX,clientY).matrixTransform(matrix.inverse());
      view.x=point.x-(point.x-view.x)*factor;view.y=point.y-(point.y-view.y)*factor;
      view.w=width;view.h*=factor;cv.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
    }
    cv.addEventListener("wheel",ev=>{ev.preventDefault();zoomAt(ev.clientX,ev.clientY,ev.deltaY>0?1.12:.89);},{passive:false});
    {const h=readHash();if(h.d){current=h.d;selected=has(diagram(),h.e)?h.e:null;}}
    draw();fitView();
    window.addEventListener("hashchange",()=>{
      const h=readHash();
      if(h.d&&(h.d!==current||(h.e||null)!==selected))go(h.d,h.e,false);
    });
  </script>
</body>
</html>
