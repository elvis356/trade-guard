name: UML Workbench Check

on:
  pull_request:
    paths:
      - "docs/uml-workbench*"
  push:
    branches: [main]
    paths:
      - "docs/uml-workbench*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate UML workbench data
        run: node docs/uml-workbench.check.js
